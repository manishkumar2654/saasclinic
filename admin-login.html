<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saas Clinic Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-emerald-50 via-white to-cyan-50 flex items-center justify-center p-4">
  <div class="w-full max-w-md rounded-3xl border border-emerald-100 bg-white p-8 shadow-2xl">
    <h1 class="text-3xl font-extrabold text-slate-900 text-center">Admin Login</h1>
    <p class="mt-2 text-center text-slate-600 text-sm">Saas Clinic Dashboard Access</p>

    <form id="adminLoginForm" class="mt-6 space-y-4">
      <input id="email" type="email" placeholder="Admin Email"
        class="w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:ring-2 focus:ring-emerald-500" />

      <input id="password" type="password" placeholder="Password"
        class="w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:ring-2 focus:ring-emerald-500" />

      <button type="submit"
        class="w-full rounded-xl bg-emerald-600 px-4 py-3 font-bold text-white hover:bg-emerald-700">
        Login
      </button>
    </form>

    <p id="loginMessage" class="mt-4 text-center text-sm font-medium"></p>
  </div>

  <script>
    const form = document.getElementById("adminLoginForm");
    const message = document.getElementById("loginMessage");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      try {
        const res = await fetch("http://localhost:5000/api/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (data.success) {
          localStorage.setItem("adminToken", data.token);
          message.textContent = "Login successful...";
          message.className = "mt-4 text-center text-sm font-medium text-emerald-600";
          setTimeout(() => {
            window.location.href = "admin-dashboard.html";
          }, 700);
        } else {
          message.textContent = data.message;
          message.className = "mt-4 text-center text-sm font-medium text-red-600";
        }
      } catch (error) {
        message.textContent = "Server error";
        message.className = "mt-4 text-center text-sm font-medium text-red-600";
      }
    });
  </script>
</body>
</html>
