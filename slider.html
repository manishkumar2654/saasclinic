<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

  <!-- slider.html -->
<section class="relative w-full overflow-hidden reveal reveal-2">
  <div class="mx-auto max-w-[92rem] px-4 sm:px-6 lg:px-8">
    
    <div class="relative mt-2 overflow-hidden rounded-[2rem] border border-slate-200/70 shadow-[0_20px_60px_-40px_rgba(2,6,23,0.35)]">

      <!-- Background -->
      <div class="absolute inset-0 bg-gradient-to-br from-[#e6f7f5] via-[#f0fbff] to-[#eaf3ff]"></div>
      <div class="absolute inset-0 bg-white/25 backdrop-blur-lg"></div>

      <!-- Glow -->
      <div class="absolute inset-0 pointer-events-none">
        <div class="absolute -left-10 -top-10 h-40 w-40 rounded-full bg-emerald-400/10 blur-3xl"></div>
        <div class="absolute -right-12 -bottom-12 h-44 w-44 rounded-full bg-blue-400/10 blur-3xl"></div>
      </div>

      <!-- MAIN GRID -->
      <div class="relative grid lg:grid-cols-2 items-center gap-3 px-5 py-4 sm:px-6 sm:py-5">

        <!-- LEFT IMAGE -->
        <div class="flex justify-center lg:justify-start">
          <div class="w-[260px] sm:w-[300px] lg:w-[340px] aspect-square rounded-full 
                      bg-white/40 backdrop-blur-xl 
                      flex items-center justify-center
                      shadow-[0_20px_50px_-30px_rgba(2,6,23,0.25)]">

            <img src="./images/logo2.png"
              class="w-[95%] object-contain scale-105 drop-shadow-[0_20px_40px_rgba(2,6,23,0.3)]">
          </div>
        </div>

        <!-- RIGHT TEXT -->
        <div class="text-center lg:text-left max-w-xl">

          <h1 class="text-3xl sm:text-4xl lg:text-5xl font-extrabold text-slate-900">
            SAAS
          </h1>

          <h2 class="mt-1 text-lg sm:text-xl lg:text-2xl font-bold text-emerald-600">
            CHEST, ALLERGY & SLEEP CENTER
          </h2>

          <p class="mt-2 text-sm sm:text-base text-slate-700 font-semibold">
            SAAS - SuperSpeciality Allergy Asthma & Sleep
          </p>

          <p class="mt-1 text-sm italic text-slate-500">
            Breathe Better, Sleep Better, Live Better
          </p>

        </div>

      </div>

      <!-- Border -->
      <div class="pointer-events-none absolute inset-0 rounded-[2rem] ring-1 ring-white/30"></div>

    </div>
  </div>
</section>



</body>

</html>
