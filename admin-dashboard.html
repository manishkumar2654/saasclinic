<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saas Clinic Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <aside class="w-72 bg-slate-900 text-white p-6 hidden md:block">
      <div>
        <h2 class="text-2xl font-extrabold">Saas Clinic</h2>
        <p class="mt-1 text-sm text-slate-300">Admin Panel</p>
      </div>

      <nav class="mt-8 space-y-3">
        <button
          onclick="showSection('inquiries')"
          class="w-full rounded-xl bg-slate-800 px-4 py-3 text-left font-semibold hover:bg-slate-700"
        >
          Inquiries
        </button>

        <button
          onclick="showSection('blogs')"
          class="w-full rounded-xl bg-slate-800 px-4 py-3 text-left font-semibold hover:bg-slate-700"
        >
          Blogs
        </button>

        <button
          onclick="logoutAdmin()"
          class="w-full rounded-xl bg-red-600 px-4 py-3 text-left font-semibold hover:bg-red-700"
        >
          Logout
        </button>
      </nav>
    </aside>

    <!-- MAIN -->
    <main class="flex-1 p-4 md:p-8">

      <!-- TOP -->
      <div class="rounded-3xl bg-white p-6 shadow-lg">
        <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
          <div>
            <h1 class="text-3xl font-extrabold text-slate-900">Admin Dashboard</h1>
            <p class="mt-2 text-slate-600">Manage inquiries and blog posts</p>
          </div>

          <div class="flex gap-3 md:hidden">
            <button
              onclick="showSection('inquiries')"
              class="rounded-xl bg-slate-900 px-4 py-2 text-sm font-bold text-white"
            >
              Inquiries
            </button>
            <button
              onclick="showSection('blogs')"
              class="rounded-xl bg-emerald-600 px-4 py-2 text-sm font-bold text-white"
            >
              Blogs
            </button>
          </div>
        </div>
      </div>

      <!-- INQUIRIES SECTION -->
      <section id="inquiriesSection" class="mt-6">
        <div class="rounded-3xl bg-white p-6 shadow-lg">
          <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
            <div>
              <h2 class="text-2xl font-extrabold text-slate-900">Appointment Inquiries</h2>
              <p class="mt-1 text-sm text-slate-500">Read and delete inquiry requests</p>
            </div>

            <button
              onclick="loadAppointments()"
              class="rounded-xl bg-emerald-600 px-4 py-2 font-bold text-white hover:bg-emerald-700"
            >
              Refresh
            </button>
          </div>

          <div id="appointmentsList" class="mt-6 grid gap-4"></div>
        </div>
      </section>

      <!-- BLOGS SECTION -->
      <section id="blogsSection" class="mt-6 hidden">
        <div class="rounded-3xl bg-white p-6 shadow-lg">
          <div>
            <h2 class="text-2xl font-extrabold text-slate-900">Add Blog</h2>
            <p class="mt-1 text-sm text-slate-500">Upload image directly from your system</p>
          </div>

          <form id="blogForm" class="mt-6 grid gap-4 md:grid-cols-2">
            <input
              id="title"
              type="text"
              placeholder="Blog Title"
              class="rounded-xl border border-slate-200 px-4 py-3 outline-none focus:ring-2 focus:ring-emerald-500"
            />

            <select
              id="category"
              class="rounded-xl border border-slate-200 px-4 py-3 outline-none focus:ring-2 focus:ring-emerald-500"
            >
              <option value="general">General</option>
              <option value="sleep">Sleep</option>
              <option value="allergy">Allergy</option>
              <option value="pulmo">Pulmonology</option>
            </select>

            <input
              id="author"
              type="text"
              placeholder="Author Name"
              class="rounded-xl border border-slate-200 px-4 py-3 outline-none focus:ring-2 focus:ring-emerald-500"
            />

            <input
              id="image"
              type="file"
              accept="image/*"
              class="rounded-xl border border-slate-200 px-4 py-3 outline-none focus:ring-2 focus:ring-emerald-500"
            />

            <textarea
              id="shortDescription"
              placeholder="Short Description"
              class="min-h-[120px] rounded-xl border border-slate-200 px-4 py-3 outline-none focus:ring-2 focus:ring-emerald-500 md:col-span-2"
            ></textarea>

            <textarea
              id="content"
              placeholder="Full Blog Content"
              class="min-h-[220px] rounded-xl border border-slate-200 px-4 py-3 outline-none focus:ring-2 focus:ring-emerald-500 md:col-span-2"
            ></textarea>

            <button
              type="submit"
              class="rounded-xl bg-emerald-600 px-4 py-3 font-bold text-white hover:bg-emerald-700 md:col-span-2"
            >
              Add Blog
            </button>
          </form>

          <p id="blogMessage" class="mt-4 text-sm font-medium"></p>

          <div class="mt-10 border-t border-slate-200 pt-8">
            <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
              <div>
                <h2 class="text-2xl font-extrabold text-slate-900">All Blogs</h2>
                <p class="mt-1 text-sm text-slate-500">Image preview ke saath blog list</p>
              </div>

              <button
                onclick="loadBlogs()"
                class="rounded-xl bg-slate-900 px-4 py-2 font-bold text-white hover:bg-slate-800"
              >
                Refresh
              </button>
            </div>

            <div id="blogsList" class="mt-6 grid gap-4"></div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <script>
    const API = "http://localhost:5000";
    const token = localStorage.getItem("adminToken");

    if (!token) {
      window.location.href = "admin-login.html";
    }

    function showSection(section) {
      document.getElementById("inquiriesSection").classList.add("hidden");
      document.getElementById("blogsSection").classList.add("hidden");

      if (section === "inquiries") {
        document.getElementById("inquiriesSection").classList.remove("hidden");
      } else {
        document.getElementById("blogsSection").classList.remove("hidden");
      }
    }

    function logoutAdmin() {
      localStorage.removeItem("adminToken");
      window.location.href = "admin-login.html";
    }

    async function loadAppointments() {
      const container = document.getElementById("appointmentsList");

      try {
        container.innerHTML = `
          <div class="rounded-2xl border border-slate-200 bg-slate-50 p-5 text-slate-600">
            Loading inquiries...
          </div>
        `;

        const res = await fetch(`${API}/api/admin/appointments`, {
          headers: {
            Authorization: `Bearer ${token}`,
          },
        });

        const data = await res.json();

        if (!data.success || !data.data || data.data.length === 0) {
          container.innerHTML = `
            <div class="rounded-2xl border border-slate-200 bg-slate-50 p-5 text-slate-600">
              No inquiries found.
            </div>
          `;
          return;
        }

        container.innerHTML = data.data.map((item) => `
          <div class="rounded-2xl border border-slate-200 p-5 shadow-sm">
            <div class="flex flex-col gap-4 lg:flex-row lg:items-start lg:justify-between">
              <div>
                <h3 class="text-xl font-extrabold text-slate-900">${item.fullName}</h3>

                <p class="mt-2 text-sm text-slate-600">
                  <strong>Phone:</strong> ${item.phoneNumber}
                </p>

                <p class="mt-1 text-sm text-slate-600">
                  <strong>Email:</strong> ${item.emailAddress && item.emailAddress.trim() ? item.emailAddress : "Not Provided"}
                </p>

                <p class="mt-3 text-sm text-slate-600">
                  <strong>Message:</strong> ${item.message}
                </p>

                <p class="mt-3 text-xs text-slate-400">
                  ${new Date(item.createdAt).toLocaleString()}
                </p>
              </div>

              <button
                onclick="deleteAppointment('${item._id}')"
                class="rounded-xl bg-red-600 px-4 py-2 font-bold text-white hover:bg-red-700"
              >
                Delete
              </button>
            </div>
          </div>
        `).join("");
      } catch (error) {
        container.innerHTML = `
          <div class="rounded-2xl border border-red-200 bg-red-50 p-5 text-red-600">
            Failed to load inquiries.
          </div>
        `;
      }
    }

    async function deleteAppointment(id) {
      const ok = confirm("Delete this inquiry?");
      if (!ok) return;

      try {
        const res = await fetch(`${API}/api/admin/appointments/${id}`, {
          method: "DELETE",
          headers: {
            Authorization: `Bearer ${token}`,
          },
        });

        const data = await res.json();
        alert(data.message || "Deleted");
        loadAppointments();
      } catch (error) {
        alert("Failed to delete inquiry");
      }
    }

    document.getElementById("blogForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const title = document.getElementById("title").value.trim();
      const category = document.getElementById("category").value;
      const author = document.getElementById("author").value.trim();
      const shortDescription = document.getElementById("shortDescription").value.trim();
      const content = document.getElementById("content").value.trim();
      const imageFile = document.getElementById("image").files[0];
      const msg = document.getElementById("blogMessage");

      const formData = new FormData();
      formData.append("title", title);
      formData.append("category", category);
      formData.append("author", author || "Saas Clinic");
      formData.append("shortDescription", shortDescription);
      formData.append("content", content);

      if (imageFile) {
        formData.append("image", imageFile);
      }

      try {
        msg.textContent = "Uploading blog...";
        msg.className = "mt-4 text-sm font-medium text-slate-600";

        const res = await fetch(`${API}/api/blogs`, {
          method: "POST",
          headers: {
            Authorization: `Bearer ${token}`,
          },
          body: formData,
        });

        const data = await res.json();

        if (data.success) {
          msg.textContent = "Blog added successfully";
          msg.className = "mt-4 text-sm font-medium text-emerald-600";
          document.getElementById("blogForm").reset();
          loadBlogs();
        } else {
          msg.textContent = data.message || "Failed to add blog";
          msg.className = "mt-4 text-sm font-medium text-red-600";
        }
      } catch (error) {
        msg.textContent = "Failed to add blog";
        msg.className = "mt-4 text-sm font-medium text-red-600";
      }
    });

    async function loadBlogs() {
      const container = document.getElementById("blogsList");

      try {
        container.innerHTML = `
          <div class="rounded-2xl border border-slate-200 bg-slate-50 p-5 text-slate-600">
            Loading blogs...
          </div>
        `;

        const res = await fetch(`${API}/api/admin/blogs`, {
          headers: {
            Authorization: `Bearer ${token}`,
          },
        });

        const data = await res.json();

        if (!data.success || !data.data || data.data.length === 0) {
          container.innerHTML = `
            <div class="rounded-2xl border border-slate-200 bg-slate-50 p-5 text-slate-600">
              No blogs found.
            </div>
          `;
          return;
        }

        container.innerHTML = data.data.map((blog) => `
          <div class="rounded-2xl border border-slate-200 p-5 shadow-sm">
            <div class="flex flex-col gap-4 lg:flex-row lg:items-start lg:justify-between">

              <div class="flex flex-col gap-4 sm:flex-row">
                <img
                  src="${blog.image}"
                  alt="${blog.title}"
                  class="h-28 w-full rounded-xl border border-slate-200 object-cover sm:h-24 sm:w-32"
                />

                <div>
                  <h3 class="text-xl font-extrabold text-slate-900">${blog.title}</h3>

                  <p class="mt-2 text-sm text-slate-600">
                    <strong>Category:</strong> ${blog.category}
                  </p>

                  <p class="mt-1 text-sm text-slate-600">
                    <strong>Author:</strong> ${blog.author || "Saas Clinic"}
                  </p>

                  <p class="mt-2 text-sm text-slate-600">
                    ${blog.shortDescription}
                  </p>

                  <p class="mt-3 text-xs text-slate-400">
                    ${new Date(blog.createdAt).toLocaleString()}
                  </p>
                </div>
              </div>

              <button
                onclick="deleteBlog('${blog._id}')"
                class="rounded-xl bg-red-600 px-4 py-2 font-bold text-white hover:bg-red-700"
              >
                Delete
              </button>
            </div>
          </div>
        `).join("");
      } catch (error) {
        container.innerHTML = `
          <div class="rounded-2xl border border-red-200 bg-red-50 p-5 text-red-600">
            Failed to load blogs.
          </div>
        `;
      }
    }

    async function deleteBlog(id) {
      const ok = confirm("Delete this blog?");
      if (!ok) return;

      try {
        const res = await fetch(`${API}/api/blogs/${id}`, {
          method: "DELETE",
          headers: {
            Authorization: `Bearer ${token}`,
          },
        });

        const data = await res.json();
        alert(data.message || "Deleted");
        loadBlogs();
      } catch (error) {
        alert("Failed to delete blog");
      }
    }

    loadAppointments();
    loadBlogs();
  </script>
</body>
</html>
