<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog Details</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <div class="max-w-4xl mx-auto px-4 py-10">
    <a href="blog.html" class="inline-block rounded-xl bg-emerald-600 px-4 py-2 text-white font-bold hover:bg-emerald-700">
      ← Back to Blog
    </a>

    <div id="blogDetails" class="mt-6 rounded-3xl bg-white p-6 shadow-lg"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    async function loadBlogDetails() {
      const container = document.getElementById("blogDetails");

      try {
        const res = await fetch(`http://localhost:5000/api/blogs/${id}`);
        const data = await res.json();

        if (!data.success) {
          container.innerHTML = `<p class="text-red-600 font-medium">Blog not found</p>`;
          return;
        }

        const blog = data.data;

        container.innerHTML = `
          <img src="${blog.image}" alt="${blog.title}" class="w-full h-[320px] object-cover rounded-2xl" />
          <h1 class="mt-6 text-4xl font-extrabold">${blog.title}</h1>
          <p class="mt-3 text-sm text-slate-500">${blog.author} • ${new Date(blog.createdAt).toLocaleDateString()}</p>
          <p class="mt-6 text-lg leading-8 text-slate-700 whitespace-pre-line">${blog.content}</p>
        `;
      } catch (error) {
        container.innerHTML = `<p class="text-red-600 font-medium">Failed to load blog</p>`;
      }
    }

    loadBlogDetails();
  </script>
</body>
</html>
